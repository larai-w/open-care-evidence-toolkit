<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open Care Evidence Toolkit — local demo</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #1f2937; }
    h1 { font-size: 1.55rem; } .note { background:#eef6ff; padding:1rem; border-radius:.5rem; }
    label { display:block; margin:1rem 0 .35rem; font-weight:600; }
    input, button { font:inherit; padding:.55rem .7rem; } button { cursor:pointer; }
    :focus-visible { outline: 3px solid #155eef; outline-offset: 2px; }
    pre { white-space:pre-wrap; background:#f7f7f8; padding:1rem; border-radius:.5rem; }
    .ok { color:#126b35; } .bad { color:#9b1c1c; }
  </style>
</head>
<body>
  <main>
    <p><button id="language" type="button" aria-pressed="false">English</button></p>
    <h1 id="title">Open Care Evidence Toolkit</h1>
    <p id="privacy-note" class="note">ローカル専用デモです。ファイルはこのブラウザ内だけで処理され、外部へ送信されません。実在の介護記録ではなく合成データを使ってください。</p>
    <label id="file-label" for="file">JSON / CSVファイル</label>
    <input id="file" type="file" accept=".json,.csv,application/json,text/csv" aria-describedby="privacy-note">
    <p id="sample-hint">検証向けの合成データを即時で読めます。</p>
    <button id="sample" type="button" aria-describedby="sample-hint">合成サンプルを表示</button>
    <h2 id="results-heading">結果</h2>
    <div id="results" role="region" aria-labelledby="results-heading" aria-live="polite">
      <div id="summary" role="status">ファイルを選択してください。</div>
      <pre id="output" role="status" tabindex="0" aria-live="polite" aria-atomic="true" aria-label="検査結果"></pre>
    </div>
  </main>
  <script type="application/json" id="rule-registry">[
    {"id":"required_fields","ja":"必須フィールド","en":"Required fields","hint":"Include all ten fields, a nonblank string event_id, and numeric schema_version 1."},
    {"id":"timestamp_timezone","ja":"時刻とタイムゾーン","en":"Timestamp and timezone","hint":"Use the documented timestamp format with a valid date and offset, and a nonblank timezone string."},
    {"id":"observation_interpretation","ja":"観察と解釈の分離","en":"Observation and interpretation","hint":"Use strings for observation and interpretation; keep observed facts separate from explanations."},
    {"id":"provenance","ja":"出典と記録者","en":"Provenance","hint":"Use nonblank strings for source and recorder_role, without personal names."},
    {"id":"missingness_status","ja":"欠測と非発生の区別","en":"Missingness and non-occurrence","hint":"Use not_recorded only for missing records, not as proof of non-occurrence."},
    {"id":"correction_reference","ja":"訂正履歴","en":"Correction reference","hint":"Use a nonblank earlier event ID or a list of nonblank IDs; use [] for no correction."}
  ]</script>
  <script>
    const REQUIRED = ['event_id','observed_at','timezone','source','recorder_role','observation','interpretation','status','corrects','schema_version'];
    const STATUSES = new Set(['observed','not_recorded','not_occurring']);
    const registry = JSON.parse(document.querySelector('#rule-registry').textContent);
    let language = 'ja', lastResults = null, lastError = null;
    const labels = Object.fromEntries(registry.map(rule => [rule.id, rule.ja]));
    const copy = {
      ja: { title:'Open Care Evidence Toolkit', note:'ローカル専用デモです。ファイルはこのブラウザ内だけで処理され、外部へ送信されません。実在の介護記録ではなく合成データを使ってください。', file:'JSON / CSVファイル', sample:'合成サンプルを表示', results:'結果', initial:'ファイルを選択してください。', count:(events, issues)=>`${events}イベント / ${issues}件の問題`, passed:'✅ 6規則を通過', missing:'(event_idなし)' },
      en: { title:'Open Care Evidence Toolkit', note:'This local demo processes files in your browser only. Nothing is sent outside. Use synthetic data, not real care records.', file:'JSON / CSV file', sample:'Show synthetic sample', results:'Results', initial:'Choose a file to begin.', count:(events, issues)=>`${events} event(s) / ${issues} issue(s)`, passed:'✅ Passed all 6 rules', missing:'(no event_id)' }
    };
    function renderResults() {
      if (!lastResults) return;
      const current = copy[language], count = lastResults.reduce((sum, item) => sum + item.issues.length, 0);
      summary.textContent = current.count(lastResults.length, count);
      summary.className = count ? 'bad' : 'ok';
      output.textContent = lastResults.map(item => `${item.id || current.missing}\n${item.issues.length ? item.issues.map(([rule, message]) => {
        const definition = registry.find(entry => entry.id === rule);
        return `⚠️ ${language === 'ja' ? definition.ja : definition.en}: ${language === 'ja' ? message : definition.hint}`;
      }).join('\n') : current.passed}`).join('\n\n');
    }
    function setLanguage(next) {
      language = next; document.documentElement.lang = next === 'ja' ? 'ja' : 'en';
      const current = copy[language];
      title.textContent = current.title; privacyNote.textContent = current.note; fileLabel.textContent = current.file; sample.textContent = current.sample; resultsHeading.textContent = current.results;
      languageButton.textContent = language === 'ja' ? 'English' : '日本語'; languageButton.setAttribute('aria-pressed', String(language === 'en'));
      if (lastError !== null) renderError();
      else if (!lastResults) summary.textContent = current.initial; else renderResults();
    }
    function nonblank(value) {
      return typeof value === 'string' && value.replace(/[\u0009-\u000d\u0020\u0085\u00a0\u1680\u2000-\u200a\u2028\u2029\u202f\u205f\u3000\ufeff]/g, '').length > 0;
    }
    function validTimestamp(value) {
      if (typeof value !== 'string') return false;
      const match = /^([0-9]{4})-([0-9]{2})-([0-9]{2})T([0-9]{2}):([0-9]{2}):([0-9]{2})(?:\.[0-9]{1,6})?(Z|[+-]([0-9]{2}):([0-9]{2}))$/.exec(value);
      // JS $ also matches before a final newline; require the entire value.
      if (!match || match[0] !== value) return false;
      const [, yearText, monthText, dayText, hour, minute, second, zone, offsetHour, offsetMinute] = match;
      const year = Number(yearText), month = Number(monthText), day = Number(dayText);
      const leap = year % 4 === 0 && (year % 100 !== 0 || year % 400 === 0);
      const days = [31, leap ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
      return year >= 1 && month >= 1 && month <= 12 && day >= 1 && day <= days[month - 1]
        && Number(hour) <= 23 && Number(minute) <= 59 && Number(second) <= 59
        && (zone === 'Z' || (Number(offsetHour) <= 23 && Number(offsetMinute) <= 59));
    }
    function check(event) {
      const issues = [], missing = REQUIRED.filter(key => !Object.hasOwn(event, key));
      if (missing.length) issues.push(['required_fields', `不足: ${missing.join(', ')}`]);
      if ((Object.hasOwn(event, 'event_id') && !nonblank(event.event_id)) ||
          (Object.hasOwn(event, 'schema_version') && event.schema_version !== 1))
        issues.push(['required_fields','event_idは空でない文字列、schema_versionは数値1が必要です']);
      if (!validTimestamp(event.observed_at)) issues.push(['timestamp_timezone','observed_atは実在する日時と対応するオフセット形式が必要です']);
      if (!nonblank(event.timezone)) issues.push(['timestamp_timezone','timezoneは空でない文字列が必要です']);
      const observation = Object.hasOwn(event, 'observation') ? event.observation : '';
      const interpretation = Object.hasOwn(event, 'interpretation') ? event.interpretation : '';
      if (typeof observation !== 'string' || typeof interpretation !== 'string')
        issues.push(['observation_interpretation','observationとinterpretationは文字列が必要です']);
      else {
        const lower = observation.toLowerCase();
        if (['と思う', 'かもしれない', 'likely', 'maybe'].some(token => lower.includes(token)))
          issues.push(['observation_interpretation','観察欄に推測表現があります']);
        if (event.status === 'observed' && !nonblank(observation)) {
          issues.push(['observation_interpretation','observedには観察内容が必要です']);
          if (nonblank(interpretation)) issues.push(['observation_interpretation','解釈だけで、観察の根拠がありません']);
        }
      }
      if (!nonblank(event.source) || !nonblank(event.recorder_role)) issues.push(['provenance','sourceとrecorder_roleを空でない文字列で記録してください']);
      if (!STATUSES.has(event.status)) issues.push(['missingness_status','statusはobserved / not_recorded / not_occurringのいずれかです']);
      if (event.status === 'not_recorded' && (nonblank(observation) || nonblank(interpretation))) issues.push(['missingness_status','not_recordedに観察・解釈を入れないでください']);
      if (Object.hasOwn(event, 'corrects') && !(nonblank(event.corrects) || (Array.isArray(event.corrects) && event.corrects.every(nonblank))))
        issues.push(['correction_reference','correctsは空でないIDまたはID配列、訂正なしは[]を使用してください']);
      return issues;
    }
    function parseCsv(text) {
      const rows = [], normalized = text.replace(/^\uFEFF/, '');
      let row = [], cell = '', state = 'start', touched = false;
      for (let i = 0; i < normalized.length; i += 1) {
        const char = normalized[i], next = normalized[i + 1];
        if (state === 'quoted') {
          if (char === '"' && next === '"') { cell += '"'; i += 1; }
          else if (char === '"') state = 'closed';
          else cell += char;
          continue;
        }
        if (char === ',') { row.push(cell); cell = ''; state = 'start'; touched = true; }
        else if (char === '\n' || char === '\r') {
          if (char === '\r' && next === '\n') i += 1;
          // A physical blank line differs from a row containing empty cells.
          if (touched) { row.push(cell); rows.push(row); }
          else if (!rows.length) rows.push([]);
          row = []; cell = ''; state = 'start'; touched = false;
        } else {
          if (state === 'closed') throw new Error('Unexpected character after closing CSV quote');
          if (state === 'start' && char === '"') state = 'quoted';
          else { cell += char; state = 'plain'; }
          touched = true;
        }
      }
      if (state === 'quoted') throw new Error('Unclosed CSV quote');
      if (touched) { row.push(cell); rows.push(row); }
      const headers = rows.shift() || [];
      if (!headers.length || headers.some(header => !header.trim()) || new Set(headers).size !== headers.length)
        throw new Error('CSV requires non-empty, unique column names');
      return rows.map(row => {
        if (row.length !== headers.length) throw new Error('CSV column count mismatch');
        const event = Object.fromEntries(headers.map((header, i) => [header, row[i]]));
        if (Object.hasOwn(event, 'corrects')) event.corrects = event.corrects.split(';').filter(Boolean);
        if (Object.hasOwn(event, 'schema_version') && /^0*1$/.test(event.schema_version) && event.schema_version.slice(-1) === "1") event.schema_version = Number(event.schema_version);
        return event;
      });
    }
    function inspect(text, name) {
      lastResults = null; lastError = null;
      try {
        let events;
        if (name.toLowerCase().endsWith('.csv')) events = parseCsv(text);
        else {
          const payload = JSON.parse(text.replace(/^\uFEFF/, ''));
          if (Array.isArray(payload)) events = payload;
          else if (payload !== null && typeof payload === 'object')
            events = Object.hasOwn(payload, 'events') ? payload.events : [payload];
          else throw new Error('JSON must contain an event object, an event array, or an events array wrapper');
        }
        if (!Array.isArray(events) || !events.length) throw new Error('Input must contain a non-empty event array');
        if (events.some(event => event === null || typeof event !== 'object' || Array.isArray(event)))
          throw new Error('Every event must be an object');
        lastResults = events.map(event => ({ id:event.event_id, issues:check(event) }));
        renderResults();
      } catch (error) { lastResults = null; lastError = error.message; renderError(); }
    }
    function renderError() {
      summary.textContent = `${language === 'ja' ? '読み込みエラー' : 'Input error'}: ${lastError}`;
      summary.className = 'bad'; output.textContent = '';
    }
    const file = document.querySelector('#file'), summary = document.querySelector('#summary'), output = document.querySelector('#output'), title = document.querySelector('#title'), privacyNote = document.querySelector('#privacy-note'), fileLabel = document.querySelector('#file-label'), sample = document.querySelector('#sample'), resultsHeading = document.querySelector('#results-heading'), languageButton = document.querySelector('#language');
    file.addEventListener('change', () => { const selected = file.files[0]; if (!selected) return; const reader = new FileReader(); reader.onload = () => inspect(reader.result, selected.name); reader.readAsText(selected); });
    sample.addEventListener('click', () => inspect(JSON.stringify({events:[{event_id:'evt-browser-001',observed_at:'2026-09-10T09:00:00+09:00',timezone:'Asia/Tokyo',source:'synthetic-care-log',recorder_role:'family-caregiver',observation:'朝食後に水を200mL飲んだ',interpretation:'',status:'observed',corrects:[],schema_version:1}]}), 'sample.json'));
    languageButton.addEventListener('click', () => setLanguage(language === 'ja' ? 'en' : 'ja'));
  </script>
</body>
</html>
