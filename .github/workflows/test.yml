name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check public repository boundary
        run: python scripts/check_public_repo.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Test browser CSV parser
        run: node tests/test_demo_csv.mjs
      - name: Test browser demo smoke
        run: node tests/test_demo_smoke.mjs
